# Los valores por defecto sirven para correr en local sin configurar nada.
# En Docker y en despliegue se pisan con variables de entorno, para no
# dejar credenciales versionadas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gapfinder}
spring.datasource.username=${DB_USERNAME:gapfinder}
spring.datasource.password=${DB_PASSWORD:gapfinder}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Solo health e info quedan expuestos: el resto de endpoints de actuator
# traen detalle interno que no deberia ser publico.
management.endpoints.web.exposure.include=health,info
